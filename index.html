可以，把代码写得更简单、更像学生作业版本：

```html
<!DOCTYPE html>
<html>
<head>
  <title>My Garden</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: lightgreen;
    }

    #text {
      position: fixed;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <div id="text">
    My Peaceful Garden<br>
    Press 1 = flower, 2 = tree, 3 = rain, 4 = night
  </div>

  <canvas id="myCanvas"></canvas>

  <script>
    let canvas = document.getElementById("myCanvas");
    let ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let tool = "flower";
    let night = false;
    let rain = false;

    let plants = [];
    let drops = [];

    function makeFlower(x, y) {
      plants.push({
        kind: "flower",
        x: x,
        y: y,
        size: 10
      });
    }

    function makeTree(x, y) {
      plants.push({
        kind: "tree",
        x: x,
        y: y,
        size: 25
      });
    }

    function drawFlower(p) {
      ctx.fillStyle = "green";
      ctx.fillRect(p.x - 2, p.y, 4, p.size * 2);

      ctx.fillStyle = "pink";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "yellow";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawTree(p) {
      ctx.fillStyle = "brown";
      ctx.fillRect(p.x - 5, p.y, 10, p.size);

      ctx.fillStyle = "darkgreen";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawRain() {
      ctx.strokeStyle = "blue";

      for (let i = 0; i < drops.length; i++) {
        let d = drops[i];

        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x, d.y + 10);
        ctx.stroke();

        d.y = d.y + 5;
      }
    }

    function drawEverything() {
      if (night == true) {
        ctx.fillStyle = "darkblue";
      } else {
        ctx.fillStyle = "lightgreen";
      }

      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < plants.length; i++) {
        let p = plants[i];

        if (p.kind == "flower") {
          drawFlower(p);
        }

        if (p.kind == "tree") {
          drawTree(p);
        }
      }

      if (rain == true) {
        drawRain();
      }
    }

    canvas.addEventListener("click", function(event) {
      if (tool == "flower") {
        makeFlower(event.clientX, event.clientY);
      }

      if (tool == "tree") {
        makeTree(event.clientX, event.clientY);
      }
    });

    canvas.addEventListener("mousemove", function(event) {
      if (Math.random() < 0.03) {
        makeFlower(event.clientX, event.clientY);
      }
    });

    document.addEventListener("keydown", function(event) {
      if (event.key == "1") {
        tool = "flower";
      }

      if (event.key == "2") {
        tool = "tree";
      }

      if (event.key == "3") {
        rain = !rain;
      }

      if (event.key == "4") {
        night = !night;
      }
    });

    setInterval(function() {
      for (let i = 0; i < plants.length; i++) {
        plants[i].size = plants[i].size + 1;
      }
    }, 1000);

    setInterval(function() {
      if (rain == true) {
        drops.push({
          x: Math.random() * canvas.width,
          y: 0
        });
      }

      drawEverything();
    }, 100);
  </script>
</body>
</html>
```
